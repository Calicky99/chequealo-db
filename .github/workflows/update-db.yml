name: Actualizar base de Chequealo
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
defaults:
  run:
    working-directory: chequealo-db
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar base
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 build_db.py
      - name: Guardar cambios
        run: |
          git config user.name "chequealo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Actualizar base"
          git push
